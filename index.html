<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ItzFizz - Scroll Hero</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>*{font-family:'Space Grotesk'}.syne{font-family:'Syne'}.letter{display:inline-block}</style></head>
<body style="background:#0a0a0a;color:#fff">
<nav class="fixed top-0 w-full z-50 flex justify-between px-6 py-5 mix-blend-difference"><div class="syne tracking-[0.3em] text-sm">ITZFIZZ DIGITAL</div><div class="text-[10px] tracking-[0.4em] opacity-60">SCROLL TO EXPLORE ↓</div></nav>
<section id="wrapper"><div id="pin" class="h-screen w-full relative overflow-hidden flex flex-col justify-center" style="background:#0a0a0a">
<div class="absolute top-[60%] w-full h-[16%] bg-[#181818]"></div>
<div id="trail" class="absolute top-[60%] h-[16%] bg-[#C8FF00] w-0"></div>
<div class="relative z-10 px-6 md:px-20"><h1 id="headline" class="syne text-[11vw] md:text-[7vw] leading-[0.9] tracking-[0.2em]"></h1><p id="sub" class="mt-5 text-[11px] tracking-[0.35em] opacity-60">PREMIUM WEB EXPERIENCES • MOTION CRAFT</p></div>
<div id="stats" class="absolute bottom-[7%] px-6 md:px-20 w-full z-20"><div class="grid grid-cols-2 md:grid-cols-4 gap-3 max-w-6xl">
<div class="stat bg-[#1c1c1c] border border-white/10 p-5 rounded-2xl"><div class="text-[#C8FF00] text-4xl syne">98%</div><div class="text-[9px] mt-2 opacity-60">CLIENT SATISFACTION</div></div>
<div class="stat bg-[#C8FF00] text-black p-5 rounded-2xl"><div class="text-4xl syne">250+</div><div class="text-[9px] mt-2 font-bold">PROJECTS SHIPPED</div></div>
<div class="stat bg-[#1c1c1c] border border-white/10 p-5 rounded-2xl"><div class="text-[#C8FF00] text-4xl syne">40%</div><div class="text-[9px] mt-2 opacity-60">FASTER LOAD TIME</div></div>
<div class="stat bg-[#1c1c1c] border border-white/10 p-5 rounded-2xl"><div class="text-4xl syne">6x</div><div class="text-[9px] mt-2 opacity-60">GROWTH IN LEADS</div></div>
</div></div>
<div id="carWrap" class="absolute top-[60%] z-30" style="left:-40%"><div class="w-[150px] md:w-[220px] h-[65px] md:h-[85px] bg-gradient-to-r from-[#FF4D12] to-[#FF8A4C] rounded-[22px] relative shadow-[0_15px_40px_rgba(0,0,0,0.8)] flex items-center justify-center"><div class="w-[45%] h-[60%] bg-[#111] rounded-[8px] opacity-90"></div><div class="absolute -left-1 top-[12px] w-[10px] h-[10px] bg-[#222] rounded-full"></div><div class="absolute -left-1 bottom-[12px] w-[10px] h-[10px] bg-[#222] rounded-full"></div><div class="absolute -right-1 top-[12px] w-[10px] h-[10px] bg-[#222] rounded-full"></div><div class="absolute -right-1 bottom-[12px] w-[10px] h-[10px] bg-[#222] rounded-full"></div></div></div>
</div></section>
<div class="h-[25vh] flex items-center justify-center opacity-20 text-[10px] tracking-[0.5em]">SCROLL DRIVEN • GSAP + TAILWIND</div>
<script>
gsap.registerPlugin(ScrollTrigger);
const t="WELCOME ITZFIZZ";document.getElementById('headline').innerHTML=t.split('').map(c=>c===' '? '<span class="letter">&nbsp;&nbsp;</span>' : `<span class="letter opacity-0 translate-y-8">${c}</span>`).join('');
gsap.set('#sub',{opacity:0});gsap.set('.stat',{opacity:0,y:15});
gsap.timeline({delay:0.2}).to('.letter',{y:0,opacity:1,duration:0.7,stagger:0.05,ease:"power3.out"}).to('#sub',{opacity:0.6,duration:0.5},'-=0.2').to('.stat',{y:0,opacity:1,duration:0.5,stagger:0.08},'-=0.2');
gsap.timeline({scrollTrigger:{trigger:"#wrapper",start:"top top",end:"+=2000",pin:"#pin",scrub:1.2}}).to('#carWrap',{left:"120%",ease:"none",duration:1},0).to('#trail',{width:"100%",ease:"none",duration:1},0).to('#headline',{y:-50,opacity:0.4,ease:"none",duration:0.6},0).to('#stats',{opacity:0,y:-20,ease:"none",duration:0.4},0.2);
</script></body></html>
